name: Check Cathay CX238 availability

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main, feature/cathay-direct-probe]
    paths:
      - 'apps/cx238/poll.py'
      - 'apps/cx238/test_poll.py'
      - '.github/workflows/cx238-seat-check.yml'

permissions:
  contents: write

concurrency:
  group: cx238-seat-check
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s apps/cx238 -p 'test_*.py' -v
      - name: Check Cathay award calendar
        run: python apps/cx238/poll.py
      - name: Upload diagnostic snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cx238-cathay-snapshot
          path: apps/cx238/status.json
      - name: Commit snapshot to main
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- apps/cx238/status.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cx238/status.json
          git commit -m "Update CX238 Cathay API check"
          git pull --rebase origin main
          git push origin HEAD:main
