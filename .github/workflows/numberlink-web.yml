name: Website and games build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/numberlink/**'
      - 'apps/air-traffic-control/**'
      - '.github/workflows/numberlink-web.yml'
  workflow_run:
    workflows: ["Validate Approach Dev"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Numberlink without changing its published URL
        run: |
          npm install --prefix production/apps/numberlink --no-audit --no-fund
          npm test --prefix production/apps/numberlink
          npm run typecheck --prefix production/apps/numberlink
          npm run export:web --prefix production/apps/numberlink

      - name: Validate both Air Traffic Control branches
        run: |
          set -euo pipefail
          for source in production development; do
            npm install --prefix "$source/apps/air-traffic-control" --no-audit --no-fund
            npm test --prefix "$source/apps/air-traffic-control"
            npm run build --prefix "$source/apps/air-traffic-control"
            test -s "$source/apps/air-traffic-control/dist/index.html"
          done

      - name: Combine root website and game environments
        run: |
          set -euo pipefail
          mkdir -p _site/numberlink _site/air-traffic-control/dev
          cp production/index.html _site/index.html
          cp -R production/js _site/js
          find production -maxdepth 1 -type f \( -name '*.ico' -o -name '*.png' \) -exec cp {} _site/ \;
          cp -R production/apps/numberlink/dist/. _site/numberlink/
          cp -R production/apps/air-traffic-control/dist/. _site/air-traffic-control/
          cp -R development/apps/air-traffic-control/dist/. _site/air-traffic-control/dev/
          PROD_SHA=$(git -C production rev-parse --short=8 HEAD)
          DEV_SHA=$(git -C development rev-parse --short=8 HEAD)
          sed -i "s@</head>@<meta name=\"build-sha\" content=\"$PROD_SHA\"></head>@" _site/air-traffic-control/index.html
          sed -i "s@</head>@<meta name=\"build-sha\" content=\"$DEV_SHA\"></head>@" _site/air-traffic-control/dev/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/numberlink/index.html
          test -s _site/air-traffic-control/index.html
          test -s _site/air-traffic-control/dev/index.html

      - name: Upload website bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
