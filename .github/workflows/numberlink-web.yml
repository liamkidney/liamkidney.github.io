name: Numberlink web build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/numberlink/**'
      - '.github/workflows/numberlink-web.yml'
  pull_request:
    paths:
      - 'apps/numberlink/**'
      - '.github/workflows/numberlink-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numberlink-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        working-directory: apps/numberlink
        run: npm install --no-audit --no-fund
      - name: Test puzzle engine
        working-directory: apps/numberlink
        run: npm test
      - name: Type-check app
        working-directory: apps/numberlink
        run: npm run typecheck
      - name: Build website from Expo source
        working-directory: apps/numberlink
        run: npm run export:web
      - name: Verify output
        run: |
          test -s apps/numberlink/dist/index.html
          test -s apps/numberlink/dist/manifest.webmanifest
          grep -q '/numberlink/' apps/numberlink/dist/index.html
      - name: Combine root website and Numberlink
        run: |
          mkdir -p _site/numberlink
          cp index.html _site/index.html
          cp -R js _site/js
          find . -maxdepth 1 -type f \( -name '*.ico' -o -name '*.png' \) -exec cp {} _site/ \;
          cp -R apps/numberlink/dist/. _site/numberlink/
          touch _site/.nojekyll
      - name: Upload production web bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
