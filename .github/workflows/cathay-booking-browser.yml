name: Cathay pre-booking browser experiment
on:
  push:
    branches: [experiment/cx238-prebooking-browser]
    paths:
      - 'apps/cx238/experiment_browser.py'
      - '.github/workflows/cathay-booking-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps firefox
      - name: Verify ordinary HTTP reachability
        run: |
          for host in www.cathaypacific.com flights.cathaypacific.com book.cathaypacific.com; do
            printf "%s: " "$host"
            curl --head -L --max-time 12 -sS -o /dev/null -w "%{http_code}\n" "https://$host/" || true
          done
      - name: Anonymous booking-page reconnaissance
        run: python -u apps/cx238/experiment_browser.py
